        "200":
          description: Test sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deliveryId:
                    type: string

  /api/webhooks/deliveries:
    get:
      operationId: getWebhookDeliveries
      summary: Get webhook delivery logs
      tags: [Webhooks]
      responses:
        "200":
          description: Delivery logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDelivery"

  /api/webhooks/health:
    get:
      operationId: getWebhookHealth
      summary: Get webhook endpoint health
      tags: [Webhooks]
      responses:
        "200":
          description: Webhook health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, disabled]
                  active:
                    type: boolean
                  failureCount:
                    type: integer
                  lastDeliveredAt:
                    type: string
                    format: date-time
                    nullable: true
                  lastAttempt:
                    type: object
                    nullable: true

  /api/webhooks/dead-letters:
    get:
      operationId: getWebhookDeadLetters
      summary: Get webhook dead-letter queue
      tags: [Webhooks]
      responses:
        "200":
          description: Dead letters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDeadLetter"

  /api/webhooks/dead-letters/{id}/replay:
    post:
      operationId: replayWebhookDeadLetter
      summary: Replay a dead-letter webhook event
      description: >-
        Admin-token gated. Re-sends the stored envelope verbatim by default.
        Set refreshTimestamp to re-stamp the envelope timestamp with the
        current time before signing, which is required to redeliver an event
        that has aged past a receiver's acceptance window. deliveryId is
        preserved in both modes so a receiver that already processed the event
        can dedupe it.
      tags: [Webhooks]
      security:
        - adminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshTimestamp:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Replay attempted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  statusCode:
                    type: integer
                  error:
                    type: string
                  replayedAt:
                    type: string
                    format: date-time
                  refreshTimestamp:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/webhooks/replay/events:
    get:
      operationId: getWebhookReplayEvents
      summary: List the webhook event catalog
      description: >-
        Events a creator may subscribe to, whether the indexer emits each one,
        and a representative data object per event. Static metadata.
      tags: [Webhooks]
      responses:
        "200":
          description: Event catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookReplayEvent"
                  subscribable:
                    type: array
                    items:
                      type: string
                  acceptanceWindowSeconds:
                    type: integer

  /api/webhooks/replay/queue:
    get:
      operationId: getWebhookReplayQueue
      summary: Get the replay queue for a wallet's webhook
      description: >-
        Dead-lettered events for the wallet's subscription, each with an
        assessment of whether replaying it can succeed.
      tags: [Webhooks]
      parameters:
        - name: walletAddress
          in: query
          required: true
          schema:
            type: string
        - name: resolved
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Replay queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookReplayQueue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/webhooks/replay/preview:
    post:
      operationId: previewWebhookReplay
      summary: Preview the envelope for a webhook event
      description: >-
        Builds the exact body and header set a receiver would see for an event
        without delivering anything. Carries a fresh deliveryId and timestamp;
        it is not what a dead-letter replay re-sends.
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event:
                  type: string
                data:
                  type: object
      responses:
        "200":
          description: Envelope preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookReplayPreview"
        "400":
          $ref: "#/components/responses/BadRequest"

