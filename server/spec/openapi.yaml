components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: Admin API token from ADMIN_API_TOKEN env var
    apiKeyQuery:
      type: apiKey
      in: header
      name: X-Api-Key
      description: API key for programmatic access

  responses:
    BadRequest:
      description: Bad request — missing or invalid fields
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
    Unprocessable:
      description: Unprocessable entity — validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
    ServiceUnavailable:
      description: Service temporarily degraded
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    GatewayTimeout:
      description: Request timed out
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

  schemas:
    # ── Health ────────────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        indexer:
          type: object
          properties:
            lastProcessedLedger:
              type: integer
            timestamp:
              type: string
              format: date-time
        backup:
          type: object
          properties:
            lastBackupAt:
              type: string
              format: date-time
              nullable: true
            status:
              type: string

    # ── SEO ───────────────────────────────────────────────────────────────────
    SEOControls:
      type: object
      properties:
        xRobotsTag:
          type: string
          example: noindex

    # ── Prompt ────────────────────────────────────────────────────────────────
    Prompt:
      type: object
      properties:
        _id:
          type: string
        image:
          type: string
        title:
          type: string
          minLength: 3
          maxLength: 100
        content:
          type: string
        rating:
          type: number
          minimum: 1
          maximum: 5
        owner:
          type: object
          properties:
            _id:
              type: string
            username:
              type: string
            walletAddress:
              type: string
        price:
          type: number
          minimum: 0
        category:
          type: string
          enum: [Marketing, "Creative Writing", Programming, Music, Gaming, Other]
        isActive:
          type: boolean
        listingStatus:
          type: string
          enum: [draft, ready, published, archived]
        reviewChecklist:
          $ref: "#/components/schemas/ReviewChecklist"
        tags:
          type: array
          items:
            type: string
            maxLength: 30
          maxItems: 10
        salesCount:
          type: integer
          minimum: 0
        currentVersionIndex:
          type: integer
        termsVersion:
          type: integer
        onChainId:
          type: string
          nullable: true
        similarityFlag:
          type: string
          enum: [clean, suspicious, highly_similar]
        similarityScore:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePromptRequest:
      type: object
      required: [image, title, content, walletAddress, price]
      properties:
        image:
          type: string
        title:
          type: string
          minLength: 3
          maxLength: 100
        content:
          type: string
          minLength: 10
        walletAddress:
          type: string
        price:
          type: number
          minimum: 0
        category:
          type: string
          enum: [Marketing, "Creative Writing", Programming, Music, Gaming, Other]

    ReviewChecklist:
      type: object
      properties:
        contentQuality:
          type: boolean
        imageValid:
          type: boolean
        pricingSet:
          type: boolean
        categoryAssigned:
          type: boolean
        termsAccepted:
          type: boolean

    # ── Test Prompt ───────────────────────────────────────────────────────────
    TestPromptRequest:
      type: object
      required: [previewPrompt, userInput]
      properties:
        previewPrompt:
          type: string
        userInput:
          type: string

    # ── User ──────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        _id:
          type: string
        walletAddress:
          type: string
        username:
          type: string
          minLength: 3
          maxLength: 30
        rating:
          type: number
          minimum: 1
          maximum: 5
        notificationPreferences:
          $ref: "#/components/schemas/NotificationPreferences"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NotificationPreferences:
      type: object
      properties:
        promptPurchased:
          type: boolean
        promptUpdated:
          type: boolean
        newReviews:
          type: boolean
        priceAlerts:
          type: boolean
        emailNotifications:
          type: boolean

    # ── Versions ──────────────────────────────────────────────────────────────
    PromptVersion:
      type: object
      properties:
        _id:
          type: string
        promptId:
          type: string
        versionIndex:
          type: integer
        content:
          type: string
        changeDescription:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time

    # ── Marketplace Transaction ───────────────────────────────────────────────
    MarketplaceTransaction:
      type: object
      properties:
        _id:
          type: string
        promptId:
          type: string
        buyerWallet:
          type: string
        sellerWallet:
          type: string
        amount:
          type: number
        transactionHash:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        createdAt:
          type: string
          format: date-time

    # ── Purchase ──────────────────────────────────────────────────────────────
    Purchase:
      type: object
      properties:
        _id:
          type: string
        promptId:
          type: string
        buyerWallet:
          type: string
        versionIndex:
          type: integer
        transactionHash:
          type: string
        createdAt:
          type: string
          format: date-time

    # ── Vote ──────────────────────────────────────────────────────────────────
    Vote:
      type: object
      properties:
        _id:
          type: string
        promptId:
          type: string
        voterWallet:
          type: string
        createdAt:
          type: string
          format: date-time

    # ── Appeal ────────────────────────────────────────────────────────────────
    Appeal:
      type: object
      properties:
        _id:
          type: string
        decisionId:
          type: string
        appellantAddress:
          type: string
        statement:
          type: string
        evidenceRefs:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn]
        resolverAddress:
          type: string
          nullable: true
        resolutionReason:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── License Term ──────────────────────────────────────────────────────────
    LicenseTerm:
      type: object
      properties:
        _id:
          type: string
        content:
          type: string
        version:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ── Reports ───────────────────────────────────────────────────────────────
    Report:
      type: object
      properties:
        _id:
          type: string
        promptId:
          type: string
        reporterAddress:
          type: string
        reason:
          type: string
          enum: [quality-issue, misleading-content, plagiarism, harmful-content, copyright, other]
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    # ── Webhooks ──────────────────────────────────────────────────────────────
    WebhookSubscription:
      type: object
      properties:
        _id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    WebhookDelivery:
      type: object
      properties:
        _id:
          type: string
        webhookId:
          type: string
        event:
          type: string
        payload:
          type: object
        status:
          type: string
          enum: [success, failed, pending]
        statusCode:
          type: integer
        attempts:
          type: integer
        deliveredAt:
          type: string
          format: date-time

    WebhookDeadLetter:
      type: object
      properties:
        _id:
          type: string
        subscriptionId:
          type: string
        event:
          type: string
        payload:
          $ref: "#/components/schemas/WebhookPayload"
        attempts:
          type: integer
        lastError:
          type: string
          nullable: true
        lastStatusCode:
          type: integer
          nullable: true
        resolved:
          type: boolean
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        replayCount:
          type: integer
        lastReplayedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    WebhookPayload:
      type: object
      properties:
        version:
          type: integer
        schemaVersion:
          type: string
        event:
          type: string
        deliveryId:
          type: string
        timestamp:
          type: string
          format: date-time
        data:
          type: object

    WebhookReplayEvent:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        dispatched:
          type: boolean
          description: Whether the indexer currently emits this event.
        subscribable:
          type: boolean
          description: Whether a creator may list this event when registering a subscription.
        sampleData:
          type: object

    WebhookReplayAssessment:
      type: object
      description: >-
        Per-row verdict on whether replaying a dead letter can succeed. The
        timestamp of a stored envelope never changes on a verbatim replay, so a
        dead letter older than acceptanceWindowSeconds is flagged `stale`:
        a receiver following server/docs/webhook-signatures.md is expected to
        reject it unless the replay is re-stamped.
      properties:
        deliveryId:
          type: string
        event:
          type: string
        originalTimestamp:
          type: string
        ageSeconds:
          type: integer
          nullable: true
        fingerprint:
          type: string
          description: SHA-256 of the canonical payload JSON; unchanged by a verbatim replay.
        replayable:
          type: boolean
        stale:
          type: boolean
        warnings:
          type: array
          items:
            type: string
            enum: [already_resolved, stale_event, unparseable_timestamp, subscription_missing, subscription_inactive]

    WebhookReplayQueueItem:
      type: object
      properties:
        id:
          type: string
        event:
          type: string
        attempts:
          type: integer
        lastError:
          type: string
          nullable: true
        lastStatusCode:
          type: integer
          nullable: true
        resolved:
          type: boolean
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        replayCount:
          type: integer
        lastReplayedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/WebhookPayload"
        subscription:
          type: object
          nullable: true
          description: Delivery target for this dead letter. Never contains the subscription secret.
          properties:
            id:
              type: string
            url:
              type: string
            active:
              type: boolean
        replay:
          $ref: "#/components/schemas/WebhookReplayAssessment"

    WebhookReplayQueue:
      type: object
      properties:
        summary:
          type: object
          properties:
            total:
              type: integer
            pending:
              type: integer
            resolved:
              type: integer
            replayable:
              type: integer
            stale:
              type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookReplayQueueItem"
        acceptanceWindowSeconds:
          type: integer

    WebhookReplayPreview:
      type: object
      description: >-
        The exact envelope and header set a receiver would see for an event,
        built without contacting anything. The preview always carries a fresh
        deliveryId and timestamp; replaying a dead letter re-sends the stored
        envelope instead.
      properties:
        event:
          type: string
        schemaVersion:
          type: string
        payload:
          $ref: "#/components/schemas/WebhookPayload"
        body:
          type: string
          description: Exact request body a receiver would verify.
        headers:
          type: object
          additionalProperties:
            type: string
        acceptanceWindowSeconds:
          type: integer

    # ── Notifications ─────────────────────────────────────────────────────────
    Notification:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        type:
          type: string
        title:
          type: string
        message:
          type: string
        data:
          type: object
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ── Prompt Order ──────────────────────────────────────────────────────────
    PromptOrder:
      type: object
      properties:
        _id:
          type: string
        walletAddress:
          type: string
        promptIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── API Key ───────────────────────────────────────────────────────────────
    ApiKey:
      type: object
      properties:
        _id:
          type: string
        prefix:
          type: string
        ownerWallet:
          type: string
        scopes:
          type: array
          items:
            type: string
        rateLimitTier:
          type: string
          enum: [basic, pro, enterprise]
        revoked:
          type: boolean
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ── Analytics ─────────────────────────────────────────────────────────────
    AnalyticsRollup:
      type: object
      properties:
        _id:
          type: string
        period:
          type: string
          enum: [daily, weekly, monthly]
        periodStart:
          type: string
          format: date-time
        metrics:
          type: object
        createdAt:
          type: string
          format: date-time

