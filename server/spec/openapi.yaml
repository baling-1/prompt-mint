openapi: "3.1.0"
info:
  title: Prompt Mint API
  version: "1.0.0"
  description: |
    Prompt Mint marketplace API — Express backend serving prompt listing,
    user management, governance, appeals, licensing, webhooks, versioning,
    notifications, analytics, and API key management.
  contact:
    name: Prompt Mint Team
  license:
    name: MIT

servers:
  - url: http://localhost:5000
    description: Local development server
  - url: https://api.promptmint.io
    description: Production server

paths:
  # ─── Health ────────────────────────────────────────────────────────────────
  /health:
    get:
      operationId: getHealth
      summary: Health check with indexer and backup statuses
      tags: [Health]
      responses:
        "200":
          description: Service health information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ─── Robots & SEO ──────────────────────────────────────────────────────────
  /robots.txt:
    get:
      operationId: getRobotsTxt
      summary: Return robots.txt
      tags: [SEO]
      responses:
        "200":
          description: robots.txt content
          content:
            text/plain:
              schema:
                type: string

  /api/seo/controls:
    get:
      operationId: getSEOControls
      summary: Get SEO control headers
      tags: [SEO]
      responses:
        "200":
          description: SEO control settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SEOControls"
    post:
      operationId: updateSEOControls
      summary: Update SEO control headers
      tags: [SEO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SEOControls"
      responses:
        "200":
          description: SEO controls updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SEOControls"

  # ─── Improve Proxy ─────────────────────────────────────────────────────────
  /api/improve-proxy:
    post:
      operationId: improvePrompt
      summary: Proxy prompt improvement through external AI gateway
      tags: [AI Proxy]
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: Raw prompt text to improve
      responses:
        "200":
          description: Improved prompt response from AI gateway
          content:
            application/json:
              schema:
                type: object
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  # ─── Chat / Test Prompt ────────────────────────────────────────────────────
  /api/chat:
    post:
      operationId: chatWithPrompt
      summary: Test a prompt via AI proxy
      tags: [AI Proxy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestPromptRequest"
      responses:
        "200":
          description: Streamed AI response
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/test-prompt:
    post:
      operationId: testPromptDirect
      summary: Test a prompt (direct route)
      tags: [AI Proxy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestPromptRequest"
      responses:
        "200":
          description: Streamed AI response
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  # ─── Prompts ───────────────────────────────────────────────────────────────
  /api/prompts:
    get:
      operationId: listPrompts
      summary: List published prompts
      tags: [Prompts]
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [Marketing, "Creative Writing", Programming, Music, Gaming, Other]
          description: Filter by category
        - name: walletAddress
          in: query
          schema:
            type: string
          description: Filter by owner wallet address
      responses:
        "200":
          description: List of published prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prompt"
    post:
      operationId: createPrompt
      summary: Create a new prompt listing
      tags: [Prompts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptRequest"
      responses:
        "201":
          description: Prompt created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  prompt:
                    $ref: "#/components/schemas/Prompt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/prompts/{id}:
    get:
      operationId: getPromptDetail
      summary: Get a single published prompt
      tags: [Prompts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prompt detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/prompts/{id}/publish:
    post:
      operationId: publishPrompt
      summary: Publish a prompt (must be in 'ready' status)
      tags: [Prompts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prompt published
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  prompt:
                    $ref: "#/components/schemas/Prompt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/prompts/{id}/archive:
    post:
      operationId: archivePrompt
      summary: Archive a prompt
      tags: [Prompts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prompt archived
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  prompt:
                    $ref: "#/components/schemas/Prompt"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/prompts/{id}/submit-review:
    post:
      operationId: submitPromptForReview
      summary: Submit a draft prompt for pre-publish review
      tags: [Prompts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prompt submitted for review
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  prompt:
                    $ref: "#/components/schemas/Prompt"
                  checklist:
                    $ref: "#/components/schemas/ReviewChecklist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/prompts/{id}/review-checklist:
    patch:
      operationId: updateReviewChecklist
      summary: Update the pre-publish review checklist
      tags: [Prompts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checklist:
                  $ref: "#/components/schemas/ReviewChecklist"
      responses:
        "200":
          description: Checklist updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  checklist:
                    $ref: "#/components/schemas/ReviewChecklist"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/prompts/{id}/tags:
    post:
      operationId: addPromptTags
      summary: Add tags to a prompt
      tags: [Prompts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items:
                    type: string
                    maxLength: 30
                  minItems: 1
      responses:
        "200":
          description: Tags added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tags:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removePromptTags
      summary: Remove tags from a prompt
      tags: [Prompts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items:
                    type: string
                  minItems: 1
      responses:
        "200":
          description: Tags removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tags:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/prompts/{id}/versions:
    post:
      operationId: publishPromptVersion
      summary: Publish a new version of a prompt
      tags: [Prompts, Versions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                changeDescription:
                  type: string
      responses:
        "201":
          description: Version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersion"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: listPromptVersions
      summary: List all versions for a prompt
      tags: [Prompts, Versions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptVersion"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/prompts/{id}/versions/{versionIndex}:
    get:
      operationId: getPromptVersionDetail
      summary: Get a specific version of a prompt
      tags: [Prompts, Versions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: versionIndex
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Version detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersion"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Buyer & Creator Prompt Endpoints ──────────────────────────────────────
  /api/prompts/buyer/{walletAddress}/owned:
    get:
      operationId: getOwnedPrompts
      summary: Get prompts owned by a wallet
      tags: [Prompts, Buyers]
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Owned prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prompt"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/prompts/buyer/{walletAddress}/transactions:
    get:
      operationId: getBuyerTransactions
      summary: Get buyer transaction history
      tags: [Prompts, Buyers]
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceTransaction"

  /api/prompts/buyer/{walletAddress}/saved:
    get:
      operationId: getSavedPrompts
      summary: Get prompts saved by a wallet
      tags: [Prompts, Buyers]
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prompt"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/prompts/buyer/save:
    post:
      operationId: savePrompt
      summary: Save a prompt to a user's saved list
      tags: [Prompts, Buyers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [promptId, walletAddress]
              properties:
                promptId:
                  type: string
                walletAddress:
                  type: string
      responses:
        "200":
          description: Prompt saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/prompts/buyer/unsave:
    post:
      operationId: unsavePrompt
      summary: Remove a prompt from user's saved list
      tags: [Prompts, Buyers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [promptId, walletAddress]
              properties:
                promptId:
                  type: string
                walletAddress:
                  type: string
      responses:
        "200":
          description: Prompt unsaved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/prompts/creator/{walletAddress}/transactions:
    get:
      operationId: getCreatorTransactions
      summary: Get creator transaction history
      tags: [Prompts, Creators]
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceTransaction"

  /api/prompts/creator/{walletAddress}/drafts:
    get:
      operationId: getDraftPrompts
      summary: Get drafts for a creator
      tags: [Prompts, Creators]
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Draft prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prompt"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Reports ───────────────────────────────────────────────────────────────
  /api/prompts/report:
    post:
      operationId: submitReport
      summary: Submit a report on a prompt
      tags: [Reports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [promptId, reporterAddress, reason]
              properties:
                promptId:
                  type: string
                reporterAddress:
                  type: string
                reason:
                  type: string
                  enum: [quality-issue, misleading-content, plagiarism, harmful-content, copyright, other]
                description:
                  type: string
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  reportId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/prompts/reports:
    get:
      operationId: getReports
      summary: Get reports (admin only)
      tags: [Reports]
      security:
        - adminToken: []
      parameters:
        - name: promptId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Reports list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/prompts/preview:
    post:
      operationId: recordPreview
      summary: Record a prompt preview (privacy-safe)
      tags: [Prompts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [promptId]
              properties:
                promptId:
                  type: string
      responses:
        "200":
          description: Preview recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/prompts/preview-stats:
    get:
      operationId: getPreviewStats
      summary: Get preview statistics for a wallet's prompts
      tags: [Prompts]
      parameters:
        - name: walletAddress
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Preview statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalPreviews:
                    type: integer
                  prompts:
                    type: array
                    items:
                      type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Users ─────────────────────────────────────────────────────────────────
  /api/user:
    post:
      operationId: createUser
      summary: Register a new user or login existing
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [walletAddress]
              properties:
                walletAddress:
                  type: string
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "200":
          description: Login successful (existing user)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: getUsers
      summary: Get users, optionally filtered by wallet
      tags: [Users]
      parameters:
        - name: walletAddress
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User(s) found
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/User"
                  - $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/user/preferences:
    get:
      operationId: getUserPreferences
      summary: Get notification preferences for a wallet
      tags: [Users]
      parameters:
        - name: walletAddress
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    $ref: "#/components/schemas/NotificationPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
    put:
      operationId: updateUserPreferences
      summary: Update notification preferences
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [walletAddress, preferences]
              properties:
                walletAddress:
                  type: string
                preferences:
                  $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  preferences:
                    $ref: "#/components/schemas/NotificationPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/user/export/challenge:
    post:
      operationId: generateExportChallenge
      summary: Generate a Stellar challenge for data export
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                walletAddress:
                  type: string
      responses:
        "200":
          description: Challenge generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time

  /api/user/export:
    post:
      operationId: requestExport
      summary: Request a signed data export
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                walletAddress:
                  type: string
                signature:
                  type: string
                challenge:
                  type: string
      responses:
        "200":
          description: Export initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportId:
                    type: string
                  status:
                    type: string
                  message:
                    type: string

  /api/user/export/download/{exportId}:
    get:
      operationId: downloadExport
      summary: Download a completed data export
      tags: [Users]
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export file
          content:
            application/json:
              schema:
                type: object

  /api/user/delete/challenge:
    post:
      operationId: generateDeletionChallenge
      summary: Generate a Stellar challenge for account deletion (#91)
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
      responses:
        "200":
          description: Challenge generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  challenge:
                    type: string
                  expiresAt:
                    type: number
                  nonce:
                    type: string

  /api/user/delete:
    post:
      operationId: requestAccountDeletion
      summary: Delete the off-chain profile data for a wallet (#91)
      description: >-
        Signature-gated deletion of the caller's User profile, notifications,
        and webhook subscriptions. Marketplace purchase/order records, votes,
        and moderation reports are intentionally retained to preserve
        on-chain access authority and audit integrity -- see
        docs/legal/data-retention-policy.md.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                signature:
                  type: string
                token:
                  type: string
      responses:
        "200":
          description: Off-chain profile data deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted:
                    type: object
                    properties:
                      profile:
                        type: boolean
                      webhookSubscriptions:
                        type: number
                      notifications:
                        type: number
                  retained:
                    type: object
                    properties:
                      collections:
                        type: array
                        items:
                          type: string
                      reason:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ─── Versions ──────────────────────────────────────────────────────────────
  /api/versions/update:
    post:
      operationId: postPromptUpdate
      summary: Post a new content version for a prompt
      tags: [Versions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                promptId:
                  type: string
                content:
                  type: string
                changeDescription:
                  type: string
      responses:
        "200":
          description: Version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersion"

  /api/versions/{promptId}/history:
    get:
      operationId: getPromptVersionHistory
